[package]
name = "rdioscanner"
version = "0.1.2"
edition = "2024"
description = "Uploads recorded calls to an Rdio Scanner server."
license = "GPL-3.0-or-later"
repository = "https://github.com/TrunkRecorder/trunk-plugin-rdioscanner"
homepage = "https://github.com/chuot/rdio-scanner"
authors = ["Luke Berndt <lukekb@gmail.com>"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.2.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust TLS (rustls), so the release builds cross-compile.
ureq = "3"

[profile.release]
strip = true
lto = true
